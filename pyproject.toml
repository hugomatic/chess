[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chess"
version = "0.1.0"
description = "Parametric CAD tools for the chess project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
chess = "chess.cli:main"

[tool.setuptools.packages.find]
include = ["chess*"]
